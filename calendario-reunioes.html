  .tab-btn:hover { color: rgba(255,255,255,0.9); }
  .tab-btn.active { color: #fff; border-bottom-color: #5b9bd5; }

  .leg-done   { background: #c6f0d4; border: 1px solid #6fc98a; }
  .leg-pending { background: #fff3cd; border: 1px solid #ffc107; }
  .leg-future { background: #e9ecef; border: 1px solid #ced4da; }

  .cal-wrapper { padding: 16px 24px; overflow-x: auto; }
  .cal-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
    table-layout: fixed;
  }

    background: #003087;
    color: white;
    font-size: 12px;
    font-weight: 700;
    padding: 10px 8px;
    text-align: center;
    border: 1px solid #002070;

    background: #002070;
    width: 60px;
    font-size: 11px;
  }
  .cal-table thead th .day-name {
    display: block;
    font-size: 13px;
    font-weight: 700;
  }
  .cal-table thead th .day-date {
    display: block;
    font-size: 11px;
    font-weight: 400;
    opacity: 0.8;
    margin-top: 2px;
  }

    background: #edf2f7;
    color: #4a5568;
    font-size: 11px;
    font-weight: 700;
    text-align: center;
    vertical-align: middle;
    border: 1px solid #d1d9e0;
    padding: 6px 4px;

  .cell-hour.morning { background: #ebf4fb; color: #2c5282; }
  .cell-hour.afternoon { background: #fef9ec; color: #744210; }

  /* Period separator row */
  .period-row td {
    background: #e2e8f0;
    font-size: 10px;
    font-weight: 700;
    color: #718096;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 4px 8px;
    border: 1px solid #d1d9e0;
    text-align: center;
  }

  /* Meeting cells */
  .cell-day {
    border: 1px solid #d1d9e0;
    padding: 4px;
    background: #fafbfc;
    height: 72px;
    width: calc((100% - 60px) / 5);
    position: relative;
  }
  .cell-day.today {
    background: #fffbf0;
    border-color: #e6b800;
  }

  .meeting-card {
    border-radius: 5px;
    padding: 5px 7px;
    line-height: 1.35;
    position: absolute;
    top: 4px; left: 4px; right: 4px; bottom: 4px;
    overflow: hidden;
    box-sizing: border-box;
    margin: 0;

  .meeting-card:last-child { margin-bottom: 0; }

      { label: 'QUI', date: '12/11', fullDate: '12/11/2026' },
      { label: 'SEX', date: '13/11', fullDate: '13/11/2026' }
    ]
  },
  {
    label: '16/11–20/11',
    num: 4,
    days: [
      { label: 'SEG', date: '16/11', fullDate: '16/11/2026' },
      { label: 'TER', date: '17/11', fullDate: '17/11/2026' },
      { label: 'QUA', date: '18/11', fullDate: '18/11/2026' },
      { label: 'QUI', date: '19/11', fullDate: '19/11/2026' },
      { label: 'SEX', date: '20/11', fullDate: '20/11/2026' }
    ]
  }
];

const HOUR_SLOTS_MORNING   = ['09h00','10h00','11h00'];
const HOUR_SLOTS_AFTERNOON = ['14h00','15h00','16h00','17h00'];
const TODAY_STR = '11/11/2026';
const STORAGE_KEY = 'cef_cal_folder_v1';

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function parseDateStr(d) {
  // dd/mm/yyyy
  const [dd, mm, yyyy] = d.split('/');
  return new Date(+yyyy, +mm - 1, +dd);
}

function normTime(t) {
  // normalise to HH:00 for slot matching
  const m = t.match(/^(\d{1,2})h/);
  if (!m) return null;
  return m[1].padStart(2,'0') + 'h00';
}

function getMeetingsForDaySlot(dayFull, slot) {
  return meetings.filter(m => {
    const matchDay = m.date === dayFull;
    const mSlot = normTime(m.time);
    return matchDay && mSlot === slot;
  });
}

function getFolder() {
  try { return localStorage.getItem(STORAGE_KEY) || ''; } catch(e) { return ''; }
}
function saveFolder() {
  const v = document.getElementById('folderPath').value.trim();
  try { localStorage.setItem(STORAGE_KEY, v); } catch(e) {}
  showToast('Pasta salva!');
  renderAll();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2200);
}

function openAta(ataFile) {
  const base = 'https://avisentin-visentin.github.io/cef-painel/atas/';
  const href = base + encodeURIComponent(ataFile);
  window.open(href, '_blank');
}

function ataLink(ataFile) {
  if (!ataFile) return '';
  const safe = ataFile.replace(/'/g, "\\'");
  return `<button class="mc-ata" onclick="openAta('${safe}')">✅ ATA enviada</button>`;
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function renderAll() {
  document.getElementById('folderPath').value = getFolder();
  renderSummary();
  renderTabs();
}

function renderSummary() {
  const done    = meetings.filter(m => m.status === 'done').length;
  const pending = meetings.filter(m => m.status === 'pending').length;
  const future  = meetings.filter(m => m.status === 'future').length;
  const total   = meetings.length;

  document.getElementById('summary-bar').innerHTML = `
    <div class="summary-card"><span class="num num-total">${total}</span><span class="lbl">Total de reuniões</span></div>
    <div class="summary-card"><span class="num num-done">${done}</span><span class="lbl">Realizadas com ATA</span></div>
    <div class="summary-card"><span class="num num-pending">${pending}</span><span class="lbl">Realizadas — ATA pendente</span></div>
    <div class="summary-card"><span class="num num-future">${future}</span><span class="lbl">Futuras / Previstas</span></div>
  `;
}

function renderTabs() {
  const tabsBar    = document.getElementById('tabs-bar');
  const tabPanels  = document.getElementById('tab-panels');
  tabsBar.innerHTML   = '';
  tabPanels.innerHTML = '';

  const tabDefs = weeks.map((w, i) => ({ label: w.label, idx: i }));

  tabDefs.forEach((td, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 2 ? ' active' : '');
    btn.textContent = td.label;
    btn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + i).classList.add('active');
    };
    tabsBar.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'tab-panel' + (i === 2 ? ' active' : '');
    panel.id = 'panel-' + i;
    panel.innerHTML = renderWeekGrid(weeks[td.idx]);
    tabPanels.appendChild(panel);
  });
}

function renderWeekGrid(week) {
  const allSlots = [
    { type: 'period', label: '☀️ Manhã', slots: HOUR_SLOTS_MORNING },
    { type: 'period', label: '🌇 Tarde', slots: HOUR_SLOTS_AFTERNOON }
  ];

  let html = '<div class="cal-wrapper"><table class="cal-table"><thead><tr>';
  html += '<th class="th-hour">Hora</th>';
  week.days.forEach(d => {
    const isToday = d.fullDate === TODAY_STR;
    html += `<th ${isToday ? 'style="background:#1a5276;border-color:#154360"' : ''}>
      <span class="day-name">${d.label}</span>
      <span class="day-date">${d.date}</span>
    </th>`;
  });
  html += '</tr></thead><tbody>';

  allSlots.forEach(period => {
    // Period separator
    html += `<tr class="period-row"><td colspan="6">${period.label}</td></tr>`;

    period.slots.forEach(slot => {
      const isMorning = period.label.includes('Manhã');
      html += `<tr>`;
      html += `<td class="cell-hour ${isMorning ? 'morning' : 'afternoon'}">${slot}</td>`;

      week.days.forEach(d => {
        const isToday = d.fullDate === TODAY_STR;
        const mtgs = getMeetingsForDaySlot(d.fullDate, slot);
        html += `<td class="cell-day${isToday ? ' today' : ''}">`;
        if (mtgs.length === 0) {
          html += '';
        } else {
          mtgs.forEach(m => {
            const cardClass = m.status === 'done' ? 'done' : m.status === 'pending' ? 'pending' : 'future';
            const nameClass = m.status === 'future' ? 'mc-name future-name' : 'mc-name';
            const timeLabel = m.duration ? `${m.time} · ${m.duration}` : m.time;
            html += `<div class="meeting-card ${cardClass}">
              <div class="mc-time">${timeLabel}</div>
              <div class="${nameClass}">${m.name}</div>`;
            if (m.status === 'done') {
              if (m.ataFile) {
                html += ataLink(m.ataFile);
              } else {
                html += `<span class="mc-no-ata">ATA pendente</span>`;
              }
            }
            html += `</div>`;
          });
        }
        html += '</td>';
      });

      html += '</tr>';
    });
  });

  html += '</tbody></table></div>';
  return html;
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
renderAll();
</script>
</body>
</html>
